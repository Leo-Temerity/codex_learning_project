<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pomodoro Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="timer-panel" aria-labelledby="app-title">
        <header class="topbar">
          <div>
            <p class="eyebrow">Pomodoro</p>
            <h1 id="app-title">Focus Dashboard</h1>
          </div>
          <div class="status-pill" id="sessionStatus">Focus 1 of 4</div>
        </header>

        <div class="flow-strip" aria-label="Pomodoro flow">
          <div class="flow-step is-active" id="focusStep">
            <span>1</span>
            <strong>Focus</strong>
          </div>
          <div class="flow-step" id="shortBreakStep">
            <span>2</span>
            <strong>Short break</strong>
          </div>
          <div class="flow-step" id="longBreakStep">
            <span>3</span>
            <strong>Long break</strong>
          </div>
        </div>

        <div class="timer-face" aria-live="polite">
          <svg class="hourglass" viewBox="0 0 260 380" aria-hidden="true">
            <defs>
              <clipPath id="topBulbClip">
                <path d="M48 52 C31 86 38 121 66 151 C82 168 111 177 121 196 C125 203 126 210 130 222 C134 210 135 203 139 196 C149 177 178 168 194 151 C222 121 229 86 212 52 Z"></path>
              </clipPath>
              <clipPath id="bottomBulbClip">
                <path d="M130 198 C126 212 116 225 102 239 C78 262 56 292 48 328 L212 328 C204 292 182 262 158 239 C144 225 134 212 130 198 Z"></path>
              </clipPath>
              <linearGradient id="glassGlow" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"></stop>
                <stop offset="1" stop-color="#d7f3f0" stop-opacity="0.42"></stop>
              </linearGradient>
              <linearGradient id="sandFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#dff5f1"></stop>
                <stop offset="1" stop-color="#b7dfda"></stop>
              </linearGradient>
            </defs>

            <rect class="hourglass-cap" x="26" y="18" width="208" height="34" rx="9"></rect>
            <rect class="hourglass-cap" x="26" y="328" width="208" height="34" rx="9"></rect>

            <path class="hourglass-glass" d="M48 52 C31 86 38 121 66 151 C82 168 111 177 121 196 C125 203 126 210 113 222 C101 234 79 244 65 259 C47 278 42 306 48 328 L212 328 C218 306 213 278 195 259 C181 244 159 234 147 222 C134 210 135 203 139 196 C149 177 178 168 194 151 C222 121 229 86 212 52 Z"></path>

            <g clip-path="url(#topBulbClip)">
              <path class="hourglass-sand hourglass-top-sand" d="M34 161 C75 143 105 169 134 154 C160 140 187 147 226 163 L226 192 L34 192 Z"></path>
            </g>
            <g clip-path="url(#bottomBulbClip)">
              <path class="hourglass-sand hourglass-bottom-sand" d="M35 230 C67 214 96 247 126 224 C158 200 181 234 225 226 L225 328 L35 328 Z"></path>
            </g>

            <path class="hourglass-highlight" d="M65 64 C48 88 52 122 80 148"></path>

            <g class="sand-stream">
              <line x1="130" y1="184" x2="130" y2="316"></line>
              <circle cx="130" cy="202" r="2.5"></circle>
              <circle cx="130" cy="244" r="2.5"></circle>
              <circle cx="130" cy="286" r="2.5"></circle>
              <circle cx="130" cy="312" r="2.5"></circle>
            </g>
          </svg>
          <div class="timer-copy">
            <p id="modeLabel">Focus</p>
            <div class="time-display" id="timeDisplay">25:00</div>
          </div>
          <span class="hourglass-state" id="timerState">Ready</span>
        </div>

        <div class="controls" aria-label="Timer controls">
          <button class="icon-button" type="button" id="resetButton" aria-label="Reset timer" title="Reset timer">
            <span aria-hidden="true">↺</span>
          </button>
          <button class="primary-button" type="button" id="startPauseButton">Start</button>
          <button class="icon-button" type="button" id="skipButton" aria-label="Skip to next mode" title="Skip to next mode">
            <span aria-hidden="true">»</span>
          </button>
        </div>
      </section>

      <aside class="settings-panel" aria-labelledby="settings-title">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Settings</p>
            <h2 id="settings-title">Timer setup</h2>
          </div>
          <button class="quiet-button" type="button" id="restoreDefaultsButton">Defaults</button>
        </div>

        <form class="settings-form" id="settingsForm">
          <label class="field">
            <span>Focus minutes</span>
            <input type="number" id="focusMinutes" min="1" max="180" step="1" inputmode="numeric">
          </label>
          <label class="field">
            <span>Short break minutes</span>
            <input type="number" id="shortBreakMinutes" min="1" max="60" step="1" inputmode="numeric">
          </label>
          <label class="field">
            <span>Long break minutes</span>
            <input type="number" id="longBreakMinutes" min="1" max="120" step="1" inputmode="numeric">
          </label>
          <label class="field">
            <span>Focus rounds before long break</span>
            <input type="number" id="roundsBeforeLongBreak" min="1" max="999" step="1" inputmode="numeric">
          </label>

          <label class="switch-row">
            <span>
              <strong>Auto-start next timer</strong>
              <small id="autoStartCopy">Wait after each session</small>
            </span>
            <input type="checkbox" id="autoStartToggle">
          </label>

          <div class="notification-row">
            <div>
              <strong>Chrome alerts</strong>
              <small id="notificationStatus">Sound is on</small>
            </div>
            <button class="quiet-button" type="button" id="notificationButton">Enable</button>
          </div>
        </form>

        <div class="summary-grid" aria-label="Current session summary">
          <div>
            <span>Completed focus</span>
            <strong id="completedFocus">0</strong>
          </div>
          <div>
            <span>Focus progress</span>
            <strong id="roundProgress">1 / 4</strong>
          </div>
          <div>
            <span>Now</span>
            <strong id="currentModeSummary">Focus</strong>
          </div>
          <div>
            <span>Next up</span>
            <strong id="nextMode">Short break</strong>
          </div>
        </div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
